<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker — Kanban</title>
  <style>
    /* ------------------------------------------------------------------ */
    /* RESET & BASE                                                        */
    /* ------------------------------------------------------------------ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-bg:        #f4f5f7;
      --color-surface:   #ffffff;
      --color-border:    #dfe1e6;
      --color-text:      #172b4d;
      --color-muted:     #5e6c84;
      --color-brand:     #0052cc;
      --color-brand-dim: #deebff;

      --priority-low:    #36b37e;
      --priority-medium: #ffab00;
      --priority-high:   #ff5630;

      --radius-sm: 4px;
      --radius-md: 8px;
      --shadow-card: 0 1px 3px rgba(9,30,66,.12), 0 0 1px rgba(9,30,66,.08);
      --shadow-card-hover: 0 4px 8px rgba(9,30,66,.15), 0 0 1px rgba(9,30,66,.15);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ------------------------------------------------------------------ */
    /* HEADER                                                              */
    /* ------------------------------------------------------------------ */
    .page-header {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: 20px 32px;
    }

    .page-header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .page-header .subtitle {
      margin-top: 2px;
      font-size: 0.875rem;
      color: var(--color-muted);
    }

    /* ------------------------------------------------------------------ */
    /* BOARD LAYOUT                                                        */
    /* ------------------------------------------------------------------ */
    .board {
      flex: 1;
      display: flex;
      gap: 20px;
      padding: 24px 32px;
      overflow-x: auto;
    }

    /* ------------------------------------------------------------------ */
    /* COLUMN                                                              */
    /* ------------------------------------------------------------------ */
    .column {
      flex: 1 1 0;
      min-width: 280px;
      max-width: 360px;
      background: var(--color-bg);
      /* ^ matches the board background so the column itself is invisible */
    }

    .column-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .column-header h2 {
      font-size: 0.8125rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-muted);
    }

    .column-header .count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--color-muted);
      background: var(--color-border);
      border-radius: 10px;
    }

    /* ------------------------------------------------------------------ */
    /* CARD LIST (future drop zone)                                        */
    /* ------------------------------------------------------------------ */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      /* When JS renders cards, it appends children here */
    }

    /* ------------------------------------------------------------------ */
    /* CARD                                                                */
    /* ------------------------------------------------------------------ */
    .card {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      padding: 14px 16px 12px;
      cursor: default;
      transition: box-shadow 0.15s ease;
      /* data-status attribute available for filtering / styling */
    }

    .card:hover {
      box-shadow: var(--shadow-card-hover);
    }

    .card-title {
      font-size: 0.9375rem;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .card-description {
      font-size: 0.8125rem;
      color: var(--color-muted);
      line-height: 1.5;
      margin-bottom: 10px;
      /* Collapse when empty */
    }

    .card-description:empty {
      display: none;
    }

    /* ------------------------------------------------------------------ */
    /* CARD META ROW                                                       */
    /* ------------------------------------------------------------------ */
    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .meta-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Priority badge */
    .priority {
      display: inline-block;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      line-height: 1.4;
    }

    .priority-Low    { background: #e3fcef; color: #006644; }
    .priority-Medium { background: #fffae6; color: #974f0c; }
    .priority-High   { background: #ffebe6; color: #bf2600; }

    /* Assignee */
    .assignee {
      font-size: 0.75rem;
      color: var(--color-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .assignee::before {
      content: "";
      display: inline-block;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--color-brand-dim);
      flex-shrink: 0;
    }

    .assignee.unassigned::before {
      background: var(--color-border);
    }

    /* Edit button */
    .btn-edit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--color-muted);
      cursor: pointer;
      font-size: 0.8125rem;
      transition: background 0.1s ease, color 0.1s ease;
    }

    .btn-edit:hover {
      background: var(--color-brand-dim);
      color: var(--color-brand);
    }

    /* ------------------------------------------------------------------ */
    /* BOARD STATES (loading / ready / empty / error)                      */
    /* ------------------------------------------------------------------ */

    /* Loading indicator — hidden unless .board.state-loading */
    #board-loading {
      display: none;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 48px 0;
      color: var(--color-muted);
      font-size: 0.9375rem;
    }

    .board.state-loading #board-loading {
      display: flex;
    }

    #board-loading::before {
      content: "";
      width: 22px;
      height: 22px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-brand);
      border-radius: 50%;
      animation: board-spin 0.8s linear infinite;
      margin-right: 10px;
      flex-shrink: 0;
    }

    @keyframes board-spin {
      to { transform: rotate(360deg); }
    }

    /* Error banner — hidden unless .board.state-error */
    #board-error {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 24px;
      margin-bottom: 20px;
      background: #ffebe6;
      border: 1px solid #ffbdad;
      border-radius: var(--radius-md);
      color: #bf2600;
      font-size: 0.875rem;
    }

    .board.state-error #board-error {
      display: flex;
    }

    #board-error .btn-retry {
      padding: 6px 16px;
      border: 1px solid #ffbdad;
      border-radius: var(--radius-sm);
      background: #fff;
      color: #bf2600;
      cursor: pointer;
      font-size: 0.8125rem;
      font-weight: 500;
    }

    #board-error .btn-retry:hover {
      background: #ffebe6;
    }

    /* Hide columns during loading */
    .board.state-loading .column {
      display: none;
    }

    /* Empty column placeholder (stays visible as future drop target) */
    .empty-placeholder {
      padding: 24px 16px;
      text-align: center;
      color: var(--color-muted);
      font-size: 0.8125rem;
      border: 2px dashed var(--color-border);
      border-radius: var(--radius-md);
    }
  </style>
</head>
<body>

  <!-- ================================================================= -->
  <!-- HEADER                                                             -->
  <!-- ================================================================= -->
  <header class="page-header">
    <h1>Task Tracker</h1>
    <p class="subtitle">Manage your work with a simple Kanban board</p>
  </header>

  <!-- ================================================================= -->
  <!-- BOARD                                                              -->
  <!-- ================================================================= -->
  <main class="board" id="board">

    <div id="board-loading">Loading tasks…</div>

    <div id="board-error">
      <span>Failed to load tasks. Check your connection and try again.</span>
      <button id="btn-retry" class="btn-retry">Retry</button>
    </div>

    <!-- ──────────────── ToDo column ──────────────── -->
    <section class="column" data-status="ToDo">
      <div class="column-header">
        <h2>To Do</h2>
        <span class="count">0</span>
      </div>
      <div class="card-list" id="list-ToDo"></div>
    </section>

    <!-- ──────────────── InProgress column ──────────── -->
    <section class="column" data-status="InProgress">
      <div class="column-header">
        <h2>In Progress</h2>
        <span class="count">0</span>
      </div>
      <div class="card-list" id="list-InProgress"></div>
    </section>

    <!-- ──────────────── Done column ──────────────── -->
    <section class="column" data-status="Done">
      <div class="column-header">
        <h2>Done</h2>
        <span class="count">0</span>
      </div>
      <div class="card-list" id="list-Done"></div>
    </section>

  </main>

  <!-- ================================================================= -->
  <!-- PLACEHOLDER SCRIPT (ready for future JS)                           -->
  <!-- ================================================================= -->
  <script>
    /* ------------------------------------------------------------------ */
    /* API                                                                 */
    /* ------------------------------------------------------------------ */
    const API_BASE = "http://localhost:8000";

    /* ------------------------------------------------------------------ */
    /* STATE                                                               */
    /* ------------------------------------------------------------------ */
    let tasks = [];

    /* ------------------------------------------------------------------ */
    /* HELPERS                                                             */
    /* ------------------------------------------------------------------ */

    /** Priority sort weight: High=3, Medium=2, Low=1 */
    const PRIORITY_ORDER = { High: 3, Medium: 2, Low: 1 };

    /**
     * Escape untrusted text before inserting into the DOM.
     * Sets textContent on a detached element and reads innerHTML —
     * the browser handles all necessary escaping.
     */
    function escapeHtml(text) {
      if (!text && text !== 0) return "";
      const div = document.createElement("div");
      div.textContent = String(text);
      return div.innerHTML;
    }

    /** Return a stable id-based comparator for tie-breaking. */
    function compareById(a, b) {
      const idA = a.id || "";
      const idB = b.id || "";
      return idA.localeCompare(idB);
    }

    /* ------------------------------------------------------------------ */
    /* FETCH                                                               */
    /* ------------------------------------------------------------------ */

    async function fetchTasks() {
      const response = await fetch(`${API_BASE}/tasks`);
      if (!response.ok) {
        throw new Error(`Fetch failed: ${response.status} ${response.statusText}`);
      }
      const data = await response.json();
      tasks = Array.isArray(data) ? data : [];
      return tasks;
    }

    /* ------------------------------------------------------------------ */
    /* RENDER                                                              */
    /* ------------------------------------------------------------------ */

    /**
     * Group `taskList` by status, sort each group (High → Medium → Low,
     * then by id ascending), and populate the three column containers.
     * Empty columns stay visible with a count of 0.
     */
    function renderBoard(taskList) {
      /** Map status → card-list container */
      const columns = {
        ToDo:       document.getElementById("list-ToDo"),
        InProgress: document.getElementById("list-InProgress"),
        Done:       document.getElementById("list-Done"),
      };

      // Group
      const grouped = { ToDo: [], InProgress: [], Done: [] };
      for (const task of taskList) {
        if (grouped.hasOwnProperty(task.status)) {
          grouped[task.status].push(task);
        }
      }

      // Sort & render each column
      for (const [status, list] of Object.entries(grouped)) {
        list.sort((a, b) => {
          const pa = PRIORITY_ORDER[a.priority] || 0;
          const pb = PRIORITY_ORDER[b.priority] || 0;
          if (pa !== pb) return pb - pa;          // descending priority
          return compareById(a, b);               // ascending id
        });

        const container = columns[status];
        if (!container) continue;

        // Clear existing content (e.g. placeholder or previous render)
        container.innerHTML = "";

        if (list.length > 0) {
          for (const task of list) {
            container.appendChild(buildCard(task));
          }
        } else {
          // Empty column — show placeholder (visible drop target)
          const placeholder = document.createElement("div");
          placeholder.className = "empty-placeholder";
          placeholder.textContent = "No tasks";
          container.appendChild(placeholder);
        }

        updateColumnCount(status, list.length);
      }
    }

    /**
     * Build a single card <article> element from a task object.
     * Text values go through escapeHtml before being set via innerHTML
     * (title, description) or remain safe via textContent (badges).
     */
    function buildCard(task) {
      const card = document.createElement("article");
      card.className = "card";
      card.setAttribute("data-status", task.status);
      card.setAttribute("data-priority", task.priority);

      // Title
      const title = document.createElement("div");
      title.className = "card-title";
      title.textContent = task.title;             // textContent = auto-escaped

      // Description (optional — collapses via CSS :empty when blank)
      const desc = document.createElement("div");
      desc.className = "card-description";
      if (task.description) {
        desc.textContent = task.description;
      }
      // (if description is "" or nullish we leave it empty so :empty hides it)

      // Meta row
      const meta = document.createElement("div");
      meta.className = "card-meta";

      const metaLeft = document.createElement("div");
      metaLeft.className = "meta-left";

      // Priority badge
      const badge = document.createElement("span");
      badge.className = `priority priority-${escapeHtml(task.priority)}`;
      badge.textContent = task.priority;

      // Assignee
      const assignee = document.createElement("span");
      assignee.className = "assignee";
      if (task.assignee) {
        assignee.textContent = task.assignee;
      } else {
        assignee.classList.add("unassigned");
        assignee.textContent = "Unassigned";
      }

      // Edit button (non-functional for now)
      const editBtn = document.createElement("button");
      editBtn.className = "btn-edit";
      editBtn.setAttribute("aria-label", "Edit task");
      editBtn.title = "Edit";
      editBtn.textContent = "✎";

      // Assemble
      metaLeft.appendChild(badge);
      metaLeft.appendChild(assignee);
      meta.appendChild(metaLeft);
      meta.appendChild(editBtn);

      card.appendChild(title);
      card.appendChild(desc);
      card.appendChild(meta);

      return card;
    }

    /** Update the count badge inside a column's header. */
    function updateColumnCount(status, count) {
      const column = document.querySelector(`.column[data-status="${escapeHtml(status)}"]`);
      if (!column) return;
      const countEl = column.querySelector(".count");
      if (countEl) countEl.textContent = String(count);
    }

    /* ------------------------------------------------------------------ */
    /* STATE MANAGEMENT                                                    */
    /* ------------------------------------------------------------------ */

    /**
     * Toggle CSS state classes on the board element.
     * Valid states: "loading" | "ready" | "empty" | "error"
     */
    function setBoardState(state) {
      const board = document.getElementById("board");
      board.classList.remove("state-loading", "state-ready", "state-empty", "state-error");
      board.classList.add(`state-${state}`);
    }

    /* ------------------------------------------------------------------ */
    /* ORCHESTRATOR                                                        */
    /* ------------------------------------------------------------------ */

    async function loadTasks() {
      setBoardState("loading");
      try {
        await fetchTasks();
        renderBoard(tasks);
        setBoardState(tasks.length === 0 ? "empty" : "ready");
      } catch (err) {
        console.error("Failed to load tasks:", err);
        setBoardState("error");
      }
    }

    /* ------------------------------------------------------------------ */
    /* BOOT                                                                */
    /* ------------------------------------------------------------------ */

    document.getElementById("btn-retry").addEventListener("click", loadTasks);

    loadTasks();
  </script>

</body>
</html>
